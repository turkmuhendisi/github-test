# =============================================================================
# NGINX Development Configuration - GlobalMain
# =============================================================================
# Development ortamı için reverse proxy
# SSL yok, basit yapılandırma, hot reload uyumlu
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # LOGGING (Development - detaylı)
    # ==========================================================================
    log_format dev_format '$remote_addr - [$time_local] "$request" '
                          '$status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time';

    access_log /var/log/nginx/access.log dev_format;

    # ==========================================================================
    # PERFORMANCE
    # ==========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip (development'ta da aktif - test için)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # ==========================================================================
    # UPSTREAM SERVERS
    # ==========================================================================
    
    # Django/Gunicorn backend
    upstream django_backend {
        server web:8000;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP SERVER (Development - SSL yok)
    # ==========================================================================
    server {
        listen 80;
        server_name localhost _;
        
        # Client max body size (file uploads)
        client_max_body_size 100M;
        
        # Proxy buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # ---------------------------------------------------------------------
        # STATIC FILES (Django collectstatic veya doğrudan)
        # ---------------------------------------------------------------------
        location /static/ {
            alias /app/webapp/static/;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            
            # Development'ta cache'i devre dışı bırakmak için:
            # add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Collected static files (production-like test için)
        location /staticfiles/ {
            alias /app/staticfiles/;
            expires 1h;
        }

        # ---------------------------------------------------------------------
        # MEDIA FILES
        # ---------------------------------------------------------------------
        location /media/ {
            alias /app/webapp/media/;
            expires 1d;
        }

        # ---------------------------------------------------------------------
        # HEALTH CHECKS (no proxy buffering)
        # ---------------------------------------------------------------------
        location /health/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Health check için timeout kısa
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /ready/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /live/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------------
        # DJANGO DEBUG TOOLBAR (development only)
        # ---------------------------------------------------------------------
        location /__debug__/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # WEBSOCKET SUPPORT (uvicorn/channels için)
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            
            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeout (uzun bağlantılar için)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---------------------------------------------------------------------
        # DJANGO APPLICATION (tüm diğer istekler)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
        }

        # ---------------------------------------------------------------------
        # ERROR PAGES (opsiyonel custom error pages)
        # ---------------------------------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ==========================================================================
    # NGINX STATUS (monitoring için)
    # ==========================================================================
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker network
            deny all;
        }
    }
}

