# =============================================================================
# BASE DOCKER COMPOSE - GlobalMain
# =============================================================================
# Temel servisler: PostgreSQL, Redis
#
# Kullanım:
#   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# =============================================================================

services:
  # ===========================================================================
  # PRIMARY DATABASE (PostgreSQL)
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: globalmain_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mayscon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ubit_081}
      POSTGRES_DB: ${DB_NAME:-globalmain}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mayscon} -d ${DB_NAME:-globalmain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalmain_network

  # ===========================================================================
  # ANALYTICS DATABASE
  # ===========================================================================
  db-analytics:
    image: postgres:16-alpine
    container_name: globalmain_db_analytics
    restart: unless-stopped
    profiles:
      - analytics
      - full
    environment:
      POSTGRES_USER: ${DB_USER:-mayscon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ubit_081}
      POSTGRES_DB: ${DB_ANALYTICS_NAME:-globalmain_analytics}
    ports:
      - "${DB_ANALYTICS_PORT:-5434}:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mayscon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalmain_network

  # ===========================================================================
  # LOGS DATABASE
  # ===========================================================================
  db-logs:
    image: postgres:16-alpine
    container_name: globalmain_db_logs
    restart: unless-stopped
    profiles:
      - logs
      - full
    environment:
      POSTGRES_USER: ${DB_USER:-mayscon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Ubit_081}
      POSTGRES_DB: ${DB_LOGS_NAME:-globalmain_logs}
    ports:
      - "${DB_LOGS_PORT:-5435}:5432"
    volumes:
      - postgres_logs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mayscon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalmain_network

  # ===========================================================================
  # REDIS (Cache & Celery Broker)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: globalmain_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalmain_network

  # ===========================================================================
  # PGADMIN (Database Management UI) - Optional
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: globalmain_pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@asringlobal.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - globalmain_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  postgres_analytics_data:
    driver: local
  postgres_logs_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  globalmain_network:
    driver: bridge
    name: globalmain_network

