# =============================================================================
# ASRIN CORE - Proje Kalıtım Şablonu
# =============================================================================
#
# Bu dosya, yeni projelerin Asrın Core servislerini nasıl extend edeceğini
# gösterir. Bu dosyayı kopyalayıp projenize uyarlayın.
#
# Kullanım:
#   1. Bu dosyayı projenize kopyalayın: docker-compose.yml
#   2. Proje adını ve ayarları güncelleyin
#   3. docker-compose up -d
#
# Merkezi servislerle birlikte çalıştırma:
#   docker-compose -f /path/to/core/infra/docker/docker-compose.core.yml \
#                  -f docker-compose.yml up -d
#
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # WEB APPLICATION - Merkezi servisi extend eder
  # ===========================================================================
  web:
    # Merkezi web-base servisinden kalıtım
    # extends:
    #   file: ./core/.v1/infra/docker/docker-compose.core.yml
    #   service: web-base
    
    # Veya bağımsız tanım:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-myproject}_web
    restart: unless-stopped
    
    environment:
      # Proje özel settings modülü
      - DJANGO_SETTINGS_MODULE=${PROJECT_NAME:-myproject}.settings
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me}
      # Database - merkezi veya proje özel
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-${PROJECT_NAME:-myproject}_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DOCKER_MODE=True
    
    ports:
      - "${WEB_PORT:-8000}:8000"
    
    volumes:
      # Proje kodları
      - .:/app
      # Static & Media
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Asrın Core (submodule kullanıyorsa)
      # - ./core/.v1:/app/core
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - project_network
      - asrin_core_network  # Merkezi servislere bağlan

  # ===========================================================================
  # DATABASE - Proje özel veya merkezi kullanım
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-myproject}_db
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-${PROJECT_NAME:-myproject}_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    ports:
      - "${DB_PORT:-5433}:5432"  # Farklı port (merkezi DB ile çakışmasın)
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - project_network

  # ===========================================================================
  # REDIS - Proje özel veya merkezi kullanım
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-myproject}_redis
    restart: unless-stopped
    
    ports:
      - "${REDIS_PORT:-6380}:6379"  # Farklı port
    
    command: redis-server --appendonly yes
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - project_network

  # ===========================================================================
  # NGINX (Production)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-myproject}_nginx
    restart: unless-stopped
    profiles:
      - production
    
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    
    depends_on:
      - web
    
    networks:
      - project_network

  # ===========================================================================
  # CELERY WORKER (Optional)
  # ===========================================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-myproject}_celery_worker
    restart: unless-stopped
    profiles:
      - celery
    
    command: celery -A ${PROJECT_NAME:-myproject} worker -l INFO
    
    environment:
      - DJANGO_SETTINGS_MODULE=${PROJECT_NAME:-myproject}.settings
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - project_network

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  project_network:
    driver: bridge
    name: ${PROJECT_NAME:-myproject}_network
  
  # Merkezi Asrın Core ağına bağlan (varsa)
  asrin_core_network:
    external: true
    name: asrin_core_network

